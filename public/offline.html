<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaMovies — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #e5e5e5; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .logo { font-size: 2.5rem; font-weight: 900; margin-bottom: 1.5rem; }
    .logo span { color: #e50914; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #808080; font-size: 0.9rem; line-height: 1.6; max-width: 320px; }
    button { margin-top: 1.5rem; padding: 0.75rem 2rem; background: #e50914; color: white; border: none; border-radius: 0.75rem; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div>
    <div class="logo">Nova<span>Movies</span></div>
    <h1>You're offline</h1>
    <p>Please check your internet connection and try again. Your watchlist data is saved locally.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
